# Solo per i comandi di Alembic da riga di comando (es. alembic revision --autogenerate, vedi CLAUDE.md).
# L'app migra da sola all'avvio (segnalazioni/db.py), senza leggere questo file. URL del database: DATABASE_URL.
[alembic]
script_location = %(here)s/segnalazioni/migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
